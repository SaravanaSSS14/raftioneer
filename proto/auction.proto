syntax = "proto3";

package raftioneer.auction;

// Client-facing contract of the auction service. Everything added after the
// first version (CreateAuction, AskAssistant, GetAuctionSummary) is purely
// additive, so older clients keep working unchanged.

// ---- Domain messages ----

message Item {
  string item_id = 1;
  string title = 2;
  string description = 3;
  string seller_id = 4;
}

message Bid {
  string bid_id = 1;
  string auction_id = 2;
  string bidder_id = 3;
  double amount = 4;
  int64 timestamp_ms = 5;
}

enum AuctionStatus {
  AUCTION_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  ACTIVE = 2;
  CLOSED = 3;
}

message Auction {
  string auction_id = 1;
  Item item = 2;
  AuctionStatus status = 3;
  double current_highest_bid = 4;
  string current_highest_bidder_id = 5;
  int64 end_time_ms = 6;      // current end time - anti-sniping can push it later
  double reserve_price = 7; // 0 = no reserve
  int64 original_end_time_ms = 8; // the end time it was listed with; 0 if unknown
}

// ---- Auth ----
// An account is created once with Register; Login only signs in an existing
// account. Every new account is opened with a mock welcome credit in its
// wallet (see PaymentService below).

message RegisterRequest {
  string username = 1;
  string password = 2;
}

message RegisterResponse {
  bool success = 1;
  string user_id = 2;
  string error_message = 3; // e.g. "Username already taken"
  string leader_hint = 4;   // set when this node is not the Raft leader: where to retry
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  bool success = 1;
  string session_token = 2;
  string user_id = 3;
  string error_message = 4;
  string leader_hint = 5; // set when this node is not the Raft leader: where to retry
}

message LogoutRequest {
  string session_token = 1;
}

message LogoutResponse {
  bool success = 1;
  string leader_hint = 2; // set when this node is not the Raft leader: where to retry
}

// ---- Browsing ----

message ListAuctionsRequest {
  AuctionStatus status_filter = 1; // UNSPECIFIED = all
}

message ListAuctionsResponse {
  repeated Auction auctions = 1;
}

message GetAuctionRequest {
  string auction_id = 1;
}

message GetAuctionResponse {
  bool found = 1;
  Auction auction = 2;
}

// ---- Auction creation ----
// Session-gated: any logged-in user can list an item (no separate seller role).

message CreateAuctionRequest {
  string session_token = 1;
  string title = 2;
  string description = 3;
  int64 duration_seconds = 4;
  double reserve_price = 5; // 0 = no reserve
}

message CreateAuctionResponse {
  bool success = 1;
  string error_message = 2;
  string auction_id = 3;
  string leader_hint = 4; // set when this node is not the Raft leader: where to retry
}

// ---- Assistant & post-auction results ----
// Clients reach the LLM node only through the app servers, and read a closed
// auction's outcome (winner, settlement, recap) back from here.

message AskAssistantRequest {
  string session_token = 1;
  string auction_id = 2; // optional; when set, that auction's details are injected as context
  string question = 3;
}

message AskAssistantResponse {
  bool success = 1;
  string answer = 2;
  bool from_fallback = 3; // true if the LLM node was unavailable and a plain-text answer was returned instead
  string error_message = 4;
  repeated string sources = 5; // auction-handbook sections the LLM node grounded the answer in
}

message GetAuctionSummaryRequest {
  string auction_id = 1;
}

message GetAuctionSummaryResponse {
  bool found = 1;
  bool closed = 2;
  string winner_id = 3;        // "" if the auction closed with no bids
  double final_price = 4;
  double buyers_premium = 5;   // mock commission on top of the final price
  string escrow_status = 6;    // mock settlement, e.g. "HELD (mock)" or "NO_SALE"
  string summary = 7;          // recap in the assistant's voice, or a plain templated one
  bool summary_from_fallback = 8;
  bool summary_ready = 9;      // false while the recap is still being written
}

// ---- Bid placement ----

message PlaceBidRequest {
  string session_token = 1;
  string auction_id = 2;
  double amount = 3;
  // Optional, for safe retries: a client-chosen id, unique per bid. Re-sending
  // the same id (e.g. after a timeout or a change of leader) returns the
  // original outcome instead of placing the bid again. "" = no deduplication.
  string request_id = 4;
}

message PlaceBidResponse {
  bool accepted = 1;
  string error_message = 2;
  // Set when this node is not the Raft leader, so the client knows where to
  // retry. Empty on the leader itself.
  string leader_hint = 3;
  Auction updated_auction = 4;
  bool replayed = 5; // true if request_id had already been applied: this is that original outcome
}

// ---- Bid history ----

message ListBidsRequest {
  string auction_id = 1;
}

message ListBidsResponse {
  bool found = 1;
  repeated Bid bids = 2; // oldest first
}

// ---- Cluster status ----
// Read-only view of one node's Raft state. Lets a client find the leader up
// front, and lets the demo / failover scripts show what the cluster is doing.

message ClusterStatusRequest {}

message ClusterStatusResponse {
  string node_id = 1;
  string role = 2;            // FOLLOWER, CANDIDATE or LEADER
  int64 term = 3;
  string leader_id = 4;       // "" while no leader is known
  string leader_address = 5;  // where to send writes; "" while unknown
  int64 commit_index = 6;
  int64 last_applied = 7;
  int64 last_log_index = 8;
  // A running SHA-256 over every entry applied so far (term + command, in
  // order). Two nodes with the same last_applied and the same digest have fed
  // their state machines exactly the same input.
  string applied_digest = 9;
  // The last few entries of this node's log, oldest first - what the demo UI
  // draws as each node's log, so replication can be watched entry by entry.
  repeated LogEntryView recent_entries = 10;
}

message LogEntryView {
  int64 index = 1;
  int64 term = 2;
  string op = 3;     // the command, e.g. PLACE_BID; NOOP for a new leader's no-op
  string label = 4;  // a short human-readable line, e.g. "bid Rs 120 on 3fa2c1d0"
}

// ---- The assignment's generic client API ----
// post(token, type, data) and get(token, type, params), as given in the
// assignment's function signatures. Each is a front door onto the typed RPCs:
// the app server's ProcessBusinessRequest routes it by `type` to the same code
// that serves PlaceBid, CreateAuction, GetWallet, and so on.

message PostRequest {
  string token = 1;
  string type = 2;        // "bid", "auction", "deposit", "confirm_receipt"
  string data = 3;        // a JSON object, e.g. {"auction_id": "3fa2c1d0", "amount": 120}
  string request_id = 4;  // optional; makes a bid or a deposit exactly-once
}

message PostResponse {
  string status = 1;      // OK, REJECTED, NOT_LEADER, UNAUTHENTICATED, INVALID or ERROR
  string message = 2;
  string id = 3;          // the id of what was created, if anything
  string leader_hint = 4;
  string data = 5;        // the typed RPC's full reply, as JSON
}

message GetRequest {
  string token = 1;       // needed for "wallet" and "transactions"; ignored otherwise
  string type = 2;        // "auctions", "auction", "bids", "summary", "wallet", "transactions", "cluster"
  map<string, string> params = 3; // e.g. {"auction_id": "3fa2c1d0"} or {"status": "ACTIVE"}
}

message DataItem {
  string id = 1;
  string data = 2;        // JSON
}

message GetResponse {
  string status = 1;      // OK, NOT_FOUND, UNAUTHENTICATED, INVALID or ERROR
  repeated DataItem items = 2;
  string message = 3;
}

service AuctionService {
  // Create an account (with a mock welcome credit). Leader only.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc ListAuctions(ListAuctionsRequest) returns (ListAuctionsResponse);
  rpc GetAuction(GetAuctionRequest) returns (GetAuctionResponse);
  rpc CreateAuction(CreateAuctionRequest) returns (CreateAuctionResponse);
  // Must beat the highest bid and meet any reserve, and the bidder must have
  // the funds (see PaymentService); sellers cannot bid on their own auctions.
  // Only the Raft leader accepts writes (Register, Login, Logout,
  // CreateAuction, PlaceBid, Deposit, ConfirmReceipt); a follower replies with
  // leader_hint set instead.
  rpc PlaceBid(PlaceBidRequest) returns (PlaceBidResponse);
  // Bidder FAQ, answered by the LLM node with the auction's details injected
  // as context. Never blocks or affects bidding; falls back to plain text.
  rpc AskAssistant(AskAssistantRequest) returns (AskAssistantResponse);
  // Outcome of a closed auction: winner, mock escrow settlement, recap.
  rpc GetAuctionSummary(GetAuctionSummaryRequest) returns (GetAuctionSummaryResponse);
  // Every accepted bid on an auction, oldest first. Served by every node.
  rpc ListBids(ListBidsRequest) returns (ListBidsResponse);
  // This node's Raft role, term and view of the leader. Served by every node.
  rpc GetClusterStatus(ClusterStatusRequest) returns (ClusterStatusResponse);
  // The assignment's post(token, type, data) / get(token, type, params).
  rpc Post(PostRequest) returns (PostResponse);
  rpc Get(GetRequest) returns (GetResponse);
}

// ---- Payments (mock) ----
// A wallet per user, and an escrow step for every sale. No real money moves:
// balances are numbers in the replicated state, changed only by committed
// Raft commands, so every node holds the same wallets.
//
//   register          wallet opened with a welcome credit
//   Deposit           mock top-up
//   PlaceBid          refused if the bid (plus buyer's premium) is more than
//                     the bidder's available funds - money already promised
//                     to auctions they are winning is not available
//   auction closes    the winner's price + premium moves into escrow (HELD)
//   ConfirmReceipt    the winner confirms hand-over: escrow is RELEASED and
//                     the seller is paid the price (the premium is the house's)

message WalletRequest {
  string session_token = 1;
}

message WalletResponse {
  bool success = 1;
  string error_message = 2;
  string user_id = 3;
  double balance = 4;     // money in the wallet (escrowed money has already left it)
  double committed = 5;   // promised to auctions this user is currently winning (price + premium)
  double available = 6;   // balance - committed: the most a new bid can use
  double in_escrow = 7;   // paid into escrow for won auctions, awaiting hand-over
}

message DepositRequest {
  string session_token = 1;
  double amount = 2;
  string request_id = 3;  // optional; a retried deposit with the same id counts once
}

message DepositResponse {
  bool success = 1;
  string error_message = 2;
  double balance = 3;
  string leader_hint = 4;
}

message ConfirmReceiptRequest {
  string session_token = 1;
  string auction_id = 2;
}

message ConfirmReceiptResponse {
  bool success = 1;
  string error_message = 2;
  string escrow_status = 3;
  string leader_hint = 4;
}

message Transaction {
  int64 txn_id = 1;
  string kind = 2;          // WELCOME_CREDIT, DEPOSIT, ESCROW_HOLD, SALE_PROCEEDS
  double amount = 3;        // + money in, - money out
  string auction_id = 4;    // "" if not about an auction
  double balance_after = 5;
  int64 timestamp_ms = 6;
}

message ListTransactionsResponse {
  bool success = 1;
  string error_message = 2;
  repeated Transaction transactions = 3; // newest first
}

service PaymentService {
  rpc GetWallet(WalletRequest) returns (WalletResponse);
  rpc Deposit(DepositRequest) returns (DepositResponse);
  rpc ConfirmReceipt(ConfirmReceiptRequest) returns (ConfirmReceiptResponse);
  rpc ListTransactions(WalletRequest) returns (ListTransactionsResponse);
}
