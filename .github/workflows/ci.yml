# Lint and every test that needs no Docker, on every push and pull request.
# The live-cluster tests (tests/test_contract.py, scripts/chaos.py, ...) need
# the full Compose stack and are run locally - see the README.
name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Generate gRPC stubs
        run: ./scripts/generate_protos.sh
      - name: Lint
        run: python -m pyflakes app_server client llm_server scripts tests ui
      - name: Raft, state machine and unit tests
        run: >
          python -m pytest -q
          tests/test_raft.py tests/test_state_machine.py tests/test_assistant.py
          tests/test_llm_service.py tests/test_pricing_trend_db.py tests/test_retrieval.py
      - name: Randomized Raft churn (5 seeds)
        run: python scripts/raft_churn.py --seeds 5
