syntax = "proto3";

package raftioneer.llm;

// Contract for the independent LLM server (Node 1). Called by app
// servers over gRPC only; holds no authoritative auction state.

// The assignment's getLLMAnswer(requestId, query, context) ->
// getLLMAnswerResponse(requestId, answer). `question` is the query.
message GetLLMAnswerRequest {
  string question = 1;
  string context = 2;    // relevant item/auction info injected by the app server
  string request_id = 3; // chosen by the app server; echoed back and logged on both sides
}

message GetLLMAnswerResponse {
  string answer = 1;
  string request_id = 2; // the request's request_id
  // Titles of the auction-handbook sections the answer was grounded in
  // (retrieved by the LLM node), so a caller can show its sources.
  repeated string sources = 3;
}

message GenerateItemDescriptionRequest {
  string title = 1;
  repeated string keywords = 2;
}

message GenerateItemDescriptionResponse {
  string description = 1;
}

message SummarizeAuctionRequest {
  string auction_id = 1;
  string item_title = 2;
  repeated double bid_history = 3;
  double final_price = 4;
  // Average final price across other closed, sold auctions (this one
  // excluded), if any exist yet. `optional` so 0.0 and "not available"
  // are distinguishable - the app server never fabricates a trend from
  // zero prior sales.
  optional double average_sale_price = 5;
}

message SummarizeAuctionResponse {
  string summary = 1;
}

service LLMService {
  rpc GetLLMAnswer(GetLLMAnswerRequest) returns (GetLLMAnswerResponse);
  rpc GenerateItemDescription(GenerateItemDescriptionRequest) returns (GenerateItemDescriptionResponse);
  rpc SummarizeAuction(SummarizeAuctionRequest) returns (SummarizeAuctionResponse);
}
