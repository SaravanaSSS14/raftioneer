syntax = "proto3";

package raftioneer.raft;

// Internal peer-to-peer contract between app-server nodes. Follows
// Ongaro & Ousterhout, "In Search of an Understandable Consensus
// Algorithm", Figure 2 — field names mirror the paper's RPC arguments
// so the implementation can be checked against the spec directly.

message LogEntry {
  int64 term = 1;
  int64 index = 2;
  bytes command = 3; // a state-machine command (JSON, see app_server/state_machine.py); empty = leader no-op
}

// Every Raft message names its sender and receiver: requestVote(from, to,
// ...), appendEntries(from, to, ...) and their replies. `from` is
// candidate_id / leader_id in a request (the paper's names) and from_id in a
// reply; `to` is to_id. Raft itself doesn't need them - a reply arrives on
// the call it answers - but they make every message self-describing in the
// logs.

message RequestVoteRequest {
  int64 term = 1;
  string candidate_id = 2;  // from
  int64 last_log_index = 3;
  int64 last_log_term = 4;
  string to_id = 5;
  // Pre-vote (Ongaro's thesis, section 9.6): "would you vote for me in
  // `term`?" A voter answers without changing its term or recording a vote,
  // and says no while it is still hearing from a leader. Only after a
  // majority says yes does the candidate start a real election.
  bool pre_vote = 6;
}

message RequestVoteResponse {
  int64 term = 1;
  bool vote_granted = 2;
  string from_id = 3;
  string to_id = 4;
}

message AppendEntriesRequest {
  int64 term = 1;
  string leader_id = 2;     // from
  int64 prev_log_index = 3;
  int64 prev_log_term = 4;
  repeated LogEntry entries = 5; // empty = heartbeat
  int64 leader_commit = 6;  // commitIndex
  string to_id = 7;
}

message AppendEntriesResponse {
  int64 term = 1;
  bool success = 2;         // entryAppended
  // matchIndex. On success, the follower's last entry that
  // now matches the leader's; on a refusal, where the leader should retry
  // from (a common optimization for faster nextIndex back-off).
  int64 match_index = 3;
  string from_id = 4;
  string to_id = 5;
}

service RaftService {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}
