services:
  llm_server:
    build:
    context: ..
    dockerfile: llm_server/Dockerfile
    environment:
     - NODE_ID=llm-server
     - PORT=50060
     - OLLAMA_BASE_URL=http://host.docker.internal:11434
     - OLLAMA_MODEL=qwen2.5:1.5b
     - OLLAMA_TIMEOUT_SECONDS=90
    extra_hosts:
     - "host.docker.internal:host-gateway"
    ports:
     - "50060:50060"

  app_server_1:
    build:
      context: ..
      dockerfile: app_server/Dockerfile
    environment:
      - NODE_ID=app-server-1
      - PORT=50051
      - PEERS=app_server_2:50051,app_server_3:50051
      - LLM_SERVER=llm_server:50060
    ports:
      - "50051:50051"

  app_server_2:
    build:
      context: ..
      dockerfile: app_server/Dockerfile
    environment:
      - NODE_ID=app-server-2
      - PORT=50051
      - PEERS=app_server_1:50051,app_server_3:50051
      - LLM_SERVER=llm_server:50060
    ports:
      - "50052:50051"

  app_server_3:
    build:
      context: ..
      dockerfile: app_server/Dockerfile
    environment:
      - NODE_ID=app-server-3
      - PORT=50051
      - PEERS=app_server_1:50051,app_server_2:50051
      - LLM_SERVER=llm_server:50060
    ports:
      - "50053:50051"

  client:
    build:
      context: ..
      dockerfile: client/Dockerfile
    environment:
      - NODE_ID=client
      - APP_SERVERS=app_server_1:50051,app_server_2:50051,app_server_3:50051
    depends_on:
      - app_server_1
      - app_server_2
      - app_server_3
